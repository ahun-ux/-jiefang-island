<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="地方創生課程互動島：在島上走走，挑一面待解的旗子，提出你的解方。">
<title>地方創生解方島</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: 柔和粉彩的 low-poly 3D 島佔滿畫面；白色膠囊按鈕浮在上方；點旗子從右側（手機為底部）拉出解方面板 */
:root{
  --bg:#eef5f1; --panel:#ffffff; --ink:#173a40; --muted:#5b7479; --line:#d7e5e2;
  --accent:#0e5a63; --accent-ink:#ffffff; --accent-soft:#dcefee; --warn:#c0453a;
  --sky:#d4eef0;
  --c-ren:#d0533f; --c-wen:#8a5bb3; --c-di:#3d8a50; --c-chan:#c08419; --c-jing:#2f86a3;
  --display:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1c1f; --panel:#172a2e; --ink:#e3efed; --muted:#9cb6b8; --line:#28403f;
  --accent:#5cc1c4; --accent-ink:#082326; --accent-soft:#1e3a3d; --warn:#ef7b6c; --sky:#d4eef0;
  --c-ren:#ef8370; --c-wen:#b892dc; --c-di:#71c084; --c-chan:#ecbd4e; --c-jing:#62b9d6; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1c1f; --panel:#172a2e; --ink:#e3efed; --muted:#9cb6b8; --line:#28403f;
  --accent:#5cc1c4; --accent-ink:#082326; --accent-soft:#1e3a3d; --warn:#ef7b6c; --sky:#d4eef0;
  --c-ren:#ef8370; --c-wen:#b892dc; --c-di:#71c084; --c-chan:#ecbd4e; --c-jing:#62b9d6; color-scheme:dark}
html,body{margin:0}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.65}
.app{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:12px;gap:10px;max-width:1400px;margin:0 auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px}
.brand{display:flex;flex-direction:column;line-height:1.25;margin-right:auto;min-width:0}
.brand h1{font-family:var(--display);font-weight:900;font-size:25px;margin:0;letter-spacing:.04em;color:var(--accent)}
.brand span{font-size:13px;color:var(--muted)}
.stats{display:flex;gap:6px;flex-wrap:wrap}
.stat{font-size:13px;padding:3px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-variant-numeric:tabular-nums;color:var(--muted)}
.stat b{color:var(--ink);font-size:15px}
.tbtns{display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit}
.btn{cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;box-shadow:0 1px 3px rgba(20,60,64,.08);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:focus-visible,.chipbtn:focus-visible,.icon:focus-visible,.fb:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.notice{font-size:13px;padding:7px 14px;border-radius:12px;background:var(--accent-soft);color:var(--ink)}
.stage{position:relative;flex:1;min-height:380px;border-radius:18px;overflow:hidden;background:var(--sky);box-shadow:inset 0 0 0 1px rgba(14,90,99,.12)}
#map3d{position:absolute;inset:0}
.nogl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:#173a40}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.zl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);white-space:nowrap;background:rgba(255,255,255,.94);color:#173a40;border-radius:999px;padding:3px 12px 3px 8px;font-size:14px;font-weight:700;box-shadow:0 2px 8px rgba(20,60,64,.15);display:flex;align-items:center;gap:6px}
.zl i{width:10px;height:10px;border-radius:50%;flex:none}
.zl.compact .nm{display:none}
.zl.compact{padding:3px 8px}
.fb{position:absolute;left:0;top:0;transform:translate(-50%,-100%);pointer-events:auto;cursor:pointer;border:none;background:#fff;color:#173a40;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;box-shadow:0 1px 5px rgba(20,60,64,.2);white-space:nowrap;font-variant-numeric:tabular-nums;border-bottom:3px solid var(--c)}
.fb.open{background:#fff3f1}
.fb.sel{background:#173a40;color:#fff}
.me,.other{position:absolute;left:0;top:0;transform:translate(-50%,-100%);min-width:36px;height:30px;padding:0 12px;border-radius:999px;font-weight:900;font-size:15px;display:flex;align-items:center;justify-content:center;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.me{background:#1f5560;color:#fff;box-shadow:0 3px 10px rgba(20,60,64,.3);z-index:2}
.other{background:rgba(255,255,255,.95);color:#173a40;font-weight:700;font-size:13px;height:26px;box-shadow:0 2px 6px rgba(20,60,64,.18)}
.hint{position:absolute;left:0;top:0;transform:translate(-50%,-100%);background:#173a40;color:#fff;border-radius:999px;padding:3px 12px;font-size:13px;white-space:nowrap}
.hud{position:absolute;left:12px;bottom:12px;display:flex;gap:8px;flex-wrap:wrap}
.icon{cursor:pointer;width:40px;height:40px;border:none;background:rgba(255,255,255,.95);color:#173a40;border-radius:50%;font-size:18px;font-weight:900;box-shadow:0 2px 8px rgba(20,60,64,.18)}
.legend{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.94);color:#173a40;border-radius:14px;padding:8px 12px;font-size:12px;display:flex;flex-direction:column;gap:2px;box-shadow:0 2px 8px rgba(20,60,64,.15)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.9);color:#173a40;border-radius:999px;padding:3px 12px;font-size:12px}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#173a40;color:#fff;padding:6px 16px;border-radius:999px;font-size:14px;pointer-events:none;max-width:90%;text-align:center;z-index:6}
.panel{position:absolute;top:10px;right:10px;bottom:10px;width:min(420px,calc(100% - 20px));background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:0 8px 30px rgba(20,60,64,.25);display:flex;flex-direction:column;z-index:5;overflow:hidden}
.panel .ph{display:flex;align-items:flex-start;gap:10px;padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.panel .ph h2{font-size:19px;margin:4px 0 0;line-height:1.4;text-wrap:balance}
.panel .close{margin-left:auto;flex:none}
.panel .pb{overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:14px;min-height:0}
.area{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#fff;background:var(--c);padding:1px 10px;border-radius:999px}
.place{font-size:12px;color:var(--muted);margin-left:6px}
.desc{margin:0;color:var(--ink)}
.state{font-size:13px;color:var(--muted);background:var(--accent-soft);border-radius:10px;padding:6px 10px}
.sol-list{display:flex;flex-direction:column;gap:8px;list-style:none;margin:0;padding:0}
.sol{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.sol .t{overflow-wrap:anywhere;white-space:pre-wrap}
.sol .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.mini{font-size:11px;font-weight:700;color:#fff;background:var(--c);padding:0 7px;border-radius:999px}
.vote{align-self:start;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.vote[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.del{cursor:pointer;border:none;background:none;color:var(--muted);font-size:12px;text-decoration:underline;padding:0}
.form{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--bg)}
.form h3{margin:0;font-size:16px}
label.lb{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
textarea,input[type=text],input[type=password],select{font:inherit;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink)}
textarea{min-height:84px;resize:vertical}
.uses{display:flex;flex-wrap:wrap;gap:6px}
.chipbtn{cursor:pointer;border:1.5px solid var(--c);color:var(--c);background:var(--panel);border-radius:999px;padding:2px 11px;font-weight:700;font-size:13px}
.chipbtn[aria-pressed="true"]{background:var(--c);color:#fff}
.err{color:var(--warn);font-size:13px;min-height:1em}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:12px;border:1px dashed var(--line);border-radius:12px}
.plist{display:flex;flex-direction:column;gap:6px;list-style:none;margin:0;padding:0}
.plist button{all:unset;cursor:pointer;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;width:100%;box-sizing:border-box;padding:8px 10px;border:1px solid var(--line);border-radius:12px}
.plist button:hover{border-color:var(--accent)}
.plist button:focus-visible{outline:3px solid var(--accent)}
.plist .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.howto ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.copybox{white-space:pre-wrap;font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px;max-height:160px;overflow:auto}
@media (max-width:700px){
  .brand h1{font-size:21px}
  .panel{top:auto;left:0;right:0;bottom:0;width:100%;height:72%;border-radius:18px 18px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .legend,.tip{display:none}
  .zl{font-size:12px}
}
</style>

</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>地方創生解方島</h1><span>8 個主題、40 個地方問題，挑一面待解的旗子提出你的解方</span></div>
    <div class="stats" aria-live="polite">
      <span class="stat">待解 <b id="sOpen">0</b></span>
      <span class="stat">問題 <b id="sProb">0</b></span>
      <span class="stat">解方 <b id="sSol">0</b></span>
      <span class="stat">我提出 <b id="sMine">0</b></span>
      <span class="stat">線上 <b id="sOnline">1</b></span>
    </div>
    <div class="tbtns">
      <button class="btn" id="bMe" aria-label="修改暱稱">👤 <span id="meName">設定暱稱</span></button>
      <button class="btn" id="bList">問題清單</button>
      <button class="btn" id="bHow">怎麼玩</button>
      <button class="btn" id="bAdd">＋插一面問題旗</button>
      <button class="btn" id="bAdmin" hidden>老師後台</button>
    </div>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="stage" id="stage">
    <div id="map3d" role="img" aria-label="可走動的 3D 島嶼地圖。也可以用「問題清單」按鈕瀏覽所有問題。"></div>
    <div class="labels" id="labels"></div>
    <div class="tip">點地面走路・拖曳旋轉・滾輪縮放</div>
    <div class="hud">
      <button class="icon" id="zIn" aria-label="放大">＋</button>
      <button class="icon" id="zOut" aria-label="縮小">－</button>
      <button class="icon" id="zAll" aria-label="看全島">⛶</button>
      <button class="icon" id="zRot" aria-label="視角回正（北在上）">⟲</button>
    </div>
    <div class="legend" aria-hidden="true">
      <div><i style="background:#e0574a"></i>🚩 紅旗：還沒有解方</div>
      <div><i style="background:#d9b48a"></i>🔨 鷹架：1–2 個解方</div>
      <div><i style="background:#ffd86b"></i>🏠 亮燈小屋：3 個以上</div>
    </div>
    <div class="toast" id="toast" hidden></div>
    <aside class="panel" id="panel" hidden aria-live="polite">
      <div class="ph"><div id="pHead" style="min-width:0"></div><button class="btn close" id="pClose">關閉</button></div>
      <div class="pb" id="pBody"></div>
    </aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
/* ---------- 基本設定 ---------- */
// 島上的 8 個主題區（問題的分類）
const AREAS={
  t1:{ch:"①",name:"① 人口與青年",full:"人口與青年",q:"人口正在改變",color:"#c8423b",css:"#c8423b"},
  t2:{ch:"②",name:"② 產業與就業",full:"產業與就業",q:"地方如何養活自己",color:"#b8860b",css:"#b8860b"},
  t3:{ch:"③",name:"③ 觀光與消費",full:"觀光與消費",q:"遊客來了，然後呢？",color:"#2f86a3",css:"#2f86a3"},
  t4:{ch:"④",name:"④ 生活機能",full:"生活機能",q:"留下來生活容易嗎？",color:"#b04f8f",css:"#b04f8f"},
  t5:{ch:"⑤",name:"⑤ 社區與公共空間",full:"社區與公共空間",q:"地方還有交流嗎？",color:"#d9692a",css:"#d9692a"},
  t6:{ch:"⑥",name:"⑥ 文化與地方認同",full:"文化與地方認同",q:"故事會不會消失？",color:"#7a54b0",css:"#7a54b0"},
  t7:{ch:"⑦",name:"⑦ 環境與永續",full:"環境與永續",q:"地方環境正在改變",color:"#3d8a50",css:"#3d8a50"},
  t8:{ch:"⑧",name:"⑧ 地方發展與資訊",full:"地方發展與資訊",q:"誰決定地方的未來？",color:"#56677a",css:"#56677a"}
};
const AKEYS=Object.keys(AREAS);
// 解方用到的地方資源（人文地產景）
const RES={
  ren:{ch:"人",full:"人力資源",css:"var(--c-ren)"},
  wen:{ch:"文",full:"文化歷史",css:"var(--c-wen)"},
  di:{ch:"地",full:"地理環境",css:"var(--c-di)"},
  chan:{ch:"產",full:"產業經濟",css:"var(--c-chan)"},
  jing:{ch:"景",full:"景觀空間",css:"var(--c-jing)"}
};
const RKEYS=Object.keys(RES);
function themeKey(s){s=String(s||"").trim();const m={"①":1,"②":2,"③":3,"④":4,"⑤":5,"⑥":6,"⑦":7,"⑧":8}[s]||parseInt(s,10);return m>=1&&m<=8?"t"+m:null}
// 課堂盤點出的 40 個問題：[主題, 編號, 問題]
const PRESET=[
["t1","01","高齡人口比例持續增加，地方逐漸走向超高齡社會。"],
["t1","02","年輕人離開家鄉工作，只有過年過節才會回來。"],
["t1","03","年輕人離鄉後在外地定居，不再選擇返鄉生活。"],
["t1","04","社區活動多由長者參與，年輕世代參與程度偏低。"],
["t1","05","地方青壯年人口減少，勞動力逐漸不足。"],
["t1","06","地方兒童人口減少，公共空間越來越少看見小孩。"],
["t2","07","傳統農業主要依靠高齡農民，缺乏年輕人投入。"],
["t2","08","農民年紀漸長，無力繼續耕作所有農地。"],
["t2","09","傳統產業依賴少數高齡工作者，面臨技術與經驗傳承問題。"],
["t2","10","地方產業受到季節影響，收入集中在特定月份。"],
["t2","11","地方具有特色農漁產品，但銷售方式仍以傳統交易為主。"],
["t2","12","地方產業種類相似，店家競爭激烈，部分業者難以維持經營。"],
["t2","13","地方缺乏多元的工作機會，居民需要前往其他地區就業。"],
["t3","14","地方活動吸引大量遊客，但活動結束後人潮迅速消失。"],
["t3","15","遊客只在熱門景點拍照，沒有進一步認識地方。"],
["t3","16","觀光人潮集中在特定季節，淡季缺乏遊客。"],
["t3","17","遊客集中在特定時段消費，其他時間商圈冷清。"],
["t3","18","地方曾經熱門的觀光活動逐漸沒落，相關業者停止營業。"],
["t3","19","地方特色產品吸引遊客購買，但缺乏深入了解產業的機會。"],
["t3","20","地方擁有自然景觀與特色資源，但部分景點鮮少有人造訪。"],
["t3","21","觀光住宿設施逐漸增加，但地方居民是否受益仍不清楚。"],
["t4","22","地方缺乏日常購物場所，居民需要前往其他地區採買。"],
["t4","23","地方餐飲選擇有限，居民需要到其他地區用餐。"],
["t4","24","地方只剩少數雜貨店，傳統商店逐漸消失。"],
["t4","25","偏遠地區醫療資源不足，高齡居民難以及時獲得醫療照護。"],
["t4","26","地方大眾運輸使用人數偏少，交通服務與居民需求可能存在落差。"],
["t4","27","地方部分生活服務集中在特定時段，其他時間缺乏便利性。"],
["t5","28","社區公共空間平時缺乏人潮，只有舉辦活動時才有人聚集。"],
["t5","29","地方公共活動主要由長者參與，缺乏跨世代交流。"],
["t5","30","地方擁有公共設施，但使用者集中於特定族群。"],
["t5","31","社區傳統聚會場所逐漸失去日常交流功能。"],
["t5","32","地方公共空間在夜間缺乏活動，街道逐漸冷清。"],
["t6","33","地方傳統文化活動主要由長者維持，年輕世代參與不足。"],
["t6","34","地方具有悠久的歷史與信仰文化，但平時缺乏參與者。"],
["t6","35","地方居民遷移後，原有的文化與生活記憶面臨傳承困難。"],
["t6","36","地方曾經具有代表性的產業或文化活動逐漸消失。"],
["t7","37","海岸與公共環境出現垃圾累積，影響環境品質。"],
["t7","38","地方自然生態與土地利用方式逐漸改變，原因尚不明確。"],
["t8","39","地方土地開發與商業投資受到未經證實的消息影響。"],
["t8","40","地方發展逐漸朝向觀光與商業用途，但居民的實際需求尚未被充分了解。"]
];
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 資料層（連到 Netlify 後端 /api） ---------- */
const S={mode:"net",problems:[],solutions:[],counts:{},mine:new Set(),isOwner:false,canEdit:false,readOnly:false,adminPw:"",adminEnabled:null,nick:LS.get("isle_nick",""),loaded:false,offline:false};
let UID=LS.get("isle_uid",null);

async function api(path,body){
  const r=await fetch("/api/"+path,{method:body?"POST":"GET",headers:{"content-type":"application/json","x-uid":UID},body:body?JSON.stringify(body):undefined});
  const d=await r.json().catch(()=>({}));

let loading=false,lastVer=null,lastSync=0,lastMove=0,syncing=false;
async function sync(){
  if(syncing||document.hidden||!S.nick)return;syncing=true;lastSync=Date.now();
  try{const d=await api("presence",{name:S.nick,x:Math.round(av.x),y:Math.round(av.y),d:Math.round(av.dir*100)/100});
    setPlayers(d.players||[]);S.offline=false;
    if(d.ver&&d.ver!==lastVer){lastVer=d.ver;load()}}
  catch(e){if(!S.loaded)S.offline=true}
  finally{syncing=false;lastSync=Date.now()}
}

async function load(){
  if(loading)return;loading=true;
  try{const d=await api("state");
    S.problems=(d.problems||[]).sort((a,b)=>(a.at||0)-(b.at||0));S.solutions=d.solutions||[];S.counts=d.counts||{};S.mine=new Set(d.mine||[]);S.adminEnabled=!!d.adminEnabled;S.offline=false;S.loaded=true;if(d.ver)lastVer=d.ver;
  }catch(e){S.offline=true}
  finally{loading=false}
  onData();
}
async function initData(){
  $("bAdmin").hidden=false;$("bAdmin").textContent="老師";
  await load();
  // 線上同學：走動時約 5 秒、站著時約 15 秒同步一次；切到別的分頁就暫停
  setInterval(()=>{const gap=(Date.now()-lastMove<8000)?5000:15000;if(Date.now()-lastSync>=gap)sync()},1000);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});
}
function setNotice(){
  const n=$("notice");let t="";
  if(S.offline)t="連不上島嶼伺服器，正在重試。如果你是直接在電腦上打開這個檔案，要先部署到 Netlify 才能使用。";
  else if(S.loaded&&!S.problems.length)t=S.isOwner?"島上還沒有問題。在老師後台貼上學生盤點出的問題清單，一行一個。":"島上還沒有問題。老師可以按「老師」登入後匯入；你也可以按「＋插一面問題旗」放上你盤點到的問題。";
  n.textContent=t;n.hidden=!t;
}
function failWrite(e){
  const c=e&&e.code;
  if(c==="too_short")return "內容太短，請多寫一點。";
  if(c==="no_uses")return "請至少選一個用到的地方資源。";
  if(c==="bad_area")return "請選擇問題的面向。";
  if(c==="full")return "島上的資料已滿，請老師清掉一些舊資料。";
  if(c==="not_found")return "這個問題或解方已經被刪除了。";
  if(c==="forbidden")return "只有作者本人或老師可以刪除。";
  return "送出失敗，請檢查網路後再試一次。";
}

let voting=false;
async function toggleVote(sid){
  if(voting)return;voting=true;
  const on=!S.mine.has(sid);
  if(on)S.mine.add(sid);else S.mine.delete(sid);
  S.counts[sid]=Math.max(0,(S.counts[sid]||0)+(on?1:-1));onData();
  try{await api("vote",{solId:sid,on})}catch(e){toast(failWrite(e))}

}

/* ---------- 地圖生成 ---------- */
const W=70,H=48,T=16;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261026);
function makeNoise(gs){const g=[];for(let i=0;i<(gs+1)*(gs+1);i++)g.push(R());return(x,y)=>{const fx=x*gs,fy=y*gs,ix=Math.floor(fx),iy=Math.floor(fy),tx=fx-ix,ty=fy-iy,sx=tx*tx*(3-2*tx),sy=ty*ty*(3-2*ty);const v=(a,b)=>g[Math.min(gs,Math.max(0,b))*(gs+1)+Math.min(gs,Math.max(0,a))];const a=v(ix,iy)+(v(ix+1,iy)-v(ix,iy))*sx,b=v(ix,iy+1)+(v(ix+1,iy+1)-v(ix,iy+1))*sx;return a+(b-a)*sy}}
const n1=makeNoise(5),n2=makeNoise(11);
const land=new Uint8Array(W*H),zone=new Int8Array(W*H).fill(-1),occ=new Uint8Array(W*H);
const cx=W/2,cy=H/2+1,rx=W*0.40,ry=H*0.39;
for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const d=Math.hypot((x-cx)/rx,(y-cy)/ry);
  const n=(n1(x/W,y/H)-0.5)*0.45+(n2(x/W,y/H)-0.5)*0.22;
  if(d+n<0.95&&x>2&&y>2&&x<W-3&&y<H-3)land[y*W+x]=1;
}
const isLand=(x,y)=>x>=0&&y>=0&&x<W&&y<H&&land[y*W+x]===1;
const isBeach=(x,y)=>isLand(x,y)&&(!isLand(x+1,y)||!isLand(x-1,y)||!isLand(x,y+1)||!isLand(x,y-1));
function nearestLand(px,py){let best=null,bd=1e9;for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isLand(x,y)&&!isBeach(x,y)){const d=(x-px)**2+(y-py)**2;if(d<bd){bd=d;best=[x,y]}}return best}
// 8 區中心（相對於島的半徑）
const ZREL={t1:[-0.58,-0.22],t6:[-0.18,-0.58],t4:[0.28,-0.55],t3:[0.66,-0.08],t2:[0.42,0.48],t8:[-0.02,0.5],t7:[-0.52,0.45],t5:[0.02,-0.04]};
const ZC={};AKEYS.forEach(k=>{const r=ZREL[k];ZC[k]=nearestLand(cx+rx*r[0],cy+ry*r[1])});
for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(isLand(x,y)){let bi=-1,bd=1e9;AKEYS.forEach((k,i)=>{const d=(x-ZC[k][0])**2+(y-ZC[k][1])**2;if(d<bd){bd=d;bi=i}});zone[y*W+x]=bi}
// 旗位
const SLOTS={};
AKEYS.forEach((k,i)=>{
  const c=ZC[k],cand=[];
  for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(zone[y*W+x]===i&&!isBeach(x,y)&&isLand(x,y-1)&&isLand(x,y+1))cand.push([x,y,Math.hypot(x-c[0],y-c[1])]);
  cand.sort((a,b)=>a[2]-b[2]);
  const ch=[];
  for(const p of cand){if(p[2]<2.4)continue;if(ch.every(q=>Math.hypot(q[0]-p[0],q[1]-p[1])>=3.1))ch.push(p);if(ch.length>=14)break}
  SLOTS[k]=ch.map(p=>[p[0],p[1]]);
  ch.forEach(([x,y])=>{for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const xx=x+dx,yy=y+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)occ[yy*W+xx]=1}});
  for(let dy=-2;dy<=1;dy++)for(let dx=-2;dx<=2;dx++){const xx=c[0]+dx,yy=c[1]+dy;if(xx>=0&&yy>=0&&xx<W&&yy<H)occ[yy*W+xx]=1}
});
// 碼頭
let dock=null;for(let y=H-1;y>=0&&!dock;y--)for(let x=Math.floor(cx)-6;x<Math.floor(cx)+6;x++)if(isBeach(x,y)&&!isLand(x,y+1)){dock=[x,y];break}
if(!dock)dock=nearestLand(cx,H-4);

const tV=new THREE.Vector3(),tS=new THREE.Vector3(),tQ=new THREE.Quaternion(),tE=new THREE.Euler(),tM=new THREE.Matrix4(),tC=new THREE.Color();

// 靜態物件用 InstancedMesh 批次畫
const batches={};
function put(geo,x,y,z,sx,sy,sz,color,ry,rx,rz,noShadow){
  const k=geo+(noShadow?"_n":"_s");(batches[k]||(batches[k]={geo,noShadow,items:[]})).items.push([x,y,z,sx,sy,sz,color,rx||0,ry||0,rz||0]);
}
function flush(){
  for(const k in batches){const b=batches[k];const mesh=new THREE.InstancedMesh(G[b.geo],MAT,b.items.length);
    b.items.forEach((it,i)=>{tE.set(it[7],it[8],it[9]);tQ.setFromEuler(tE);tM.compose(tV.set(it[0],it[1],it[2]),tQ,tS.set(it[3],it[4],it[5]));mesh.setMatrixAt(i,tM);mesh.setColorAt(i,tC.set(it[6]))});
    mesh.instanceMatrix.needsUpdate=true;if(mesh.instanceColor)mesh.instanceColor.needsUpdate=true;
    mesh.castShadow=!b.noShadow;mesh.receiveShadow=true;scene.add(mesh)}
}

/* 建島 */
(function buildIsland(){
  const r=rng(77);
  const water=new THREE.Mesh(new THREE.PlaneGeometry(500,500),new THREE.MeshStandardMaterial({color:0x8fcad8,roughness:.7}));
  water.rotation.x=-Math.PI/2;water.position.set(W/2,-0.05,H/2);water.receiveShadow=true;scene.add(water);
  const GROUND={t1:"#d3e8b4",t2:"#e2e4ab",t3:"#cfe8c6",t4:"#e4dcc1",t5:"#cbe6b8",t6:"#dae4b0",t7:"#bcdca9",t8:"#d8dccb"};
  const shade=(hex,a)=>{tC.set(hex);tC.offsetHSL(0,0,a);return "#"+tC.getHexString()};
  // 地塊、沙灘、淺灘
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(isLand(x,y)){
      if(isBeach(x,y))put("box",x+.5,-.4,y+.5,1,.5,1,shade("#f0dcab",(r()-.5)*.02),0,0,0,true);
      else{const k=AKEYS[zone[y*W+x]];put("box",x+.5,-.4,y+.5,1,.6,1,shade(GROUND[k],(r()-.5)*.025),0,0,0,true)}
    }else if(isLand(x+1,y)||isLand(x-1,y)||isLand(x,y+1)||isLand(x,y-1)||isLand(x+1,y+1)||isLand(x-1,y-1)||isLand(x+1,y-1)||isLand(x-1,y+1)){
      put("box",x+.5,-.06,y+.5,1,.03,1,"#ade0e6",0,0,0,true);
    }
  }
  // 道路：各區中心連到中央廣場，廣場連到碼頭
  const roadOcc=new Uint8Array(W*H);
  const road=(a,b)=>{const ax=a[0]+.5,az=a[1]+.5,bx=b[0]+.5,bz=b[1]+.5,dx=bx-ax,dz=bz-az,L=Math.hypot(dx,dz),ry=Math.atan2(dx,dz);
    put("box",(ax+bx)/2,GY,(az+bz)/2,.95,.025,L,"#c9ced4",ry,0,0,true);
    for(let s=.6;s<L-.6;s+=.9)put("box",ax+dx*s/L,GY+.026,az+dz*s/L,.07,.01,.36,"#ffffff",ry,0,0,true);
    for(let s=0;s<=L;s+=.3){const tx=Math.floor(ax+dx*s/L),tz=Math.floor(az+dz*s/L);for(let oy=-1;oy<=1;oy++)for(let ox=-1;ox<=1;ox++){if(Math.abs(ox)+Math.abs(oy)<2)roadOcc[(tz+oy)*W+tx+ox]=1}}};
  AKEYS.forEach(k=>{if(k!=="t5")road(ZC[k],ZC.t5)});
  if(dock)road(ZC.t5,[dock[0],dock[1]-1]);

  // 小元件
  const tree=(x,z,s)=>{s=s||1;put("cyl",x,GY,z,.13*s,.6*s,.13*s,"#b39878");put("ico",x,GY+.9*s,z,.95*s,1.05*s,.95*s,r()<.5?"#a5d8a0":"#8dca94",r()*3,r()*3);
    if(r()<.14)put("ico",x+.18*s,GY+1.25*s,z+.1*s,.42*s,.42*s,.42*s,"#f2ae8a",r()*3)};
  const bush=(x,z)=>put("ico",x,GY+.18,z,.55,.42,.55,"#b2dca9",r()*3,r()*3);
  const palm=(x,z)=>{const h=1.1+r()*.5;put("cyl",x,GY,z,.09,h,.09,"#c2a785");for(let i=0;i<6;i++){const a=i/6*Math.PI*2+r()*.4;put("box",x+Math.sin(a)*.28,GY+h-.02,z+Math.cos(a)*.28,.16,.035,.62,"#bfe2b2",a,-.42)}};
  const grass=(x,z)=>{for(let i=0;i<3;i++)put("box",x+(r()-.5)*.3,GY,z+(r()-.5)*.3,.035,.16+r()*.14,.035,"#a3cf8f",0,(r()-.5)*.6,(r()-.5)*.6,true)};
  const flowers=(x,z)=>{const c=["#f4a68f","#f5d46e","#cdb6ee","#ffffff"][r()*4|0];for(let i=0;i<3;i++){const fx=x+(r()-.5)*.45,fz=z+(r()-.5)*.45;put("box",fx,GY,fz,.03,.22,.03,"#93c483",0,0,0,true);put("box",fx,GY+.22,fz,.1,.06,.1,c,0,0,0,true)}};
  const house=(x,z,roof,ry,s)=>{s=s||1;put("box",x,GY,z,.9*s,.62*s,.82*s,"#faf8f3",ry);put("roof",x,GY+.62*s,z,1.0*s,.48*s,.92*s,roof,ry)};
  const ROOFS=["#f2b896","#a9cdea","#f3e2aa","#f2b896"];
  const shop=(x,z,aw)=>{put("box",x,GY,z,.9,.72,.8,"#fbf8f1");put("box",x,GY+.72,z,.98,.07,.88,"#e3d9c6");put("box",x,GY+.46,z+.44,.9,.05,.2,aw,0,.38);put("box",x,GY,z+.41,.3,.42,.02,"#9db7c4")};
  const stall=(x,z,c)=>{for(const[ox,oz]of[[-.3,-.25],[.3,-.25],[-.3,.25],[.3,.25]])put("box",x+ox,GY,z+oz,.05,.6,.05,"#b9a17f");put("box",x,GY+.6,z,.75,.06,.6,c);put("box",x,GY+.66,z,.55,.06,.4,"#ffffff");put("box",x,GY,z+.15,.6,.3,.25,"#d8b68a")};
  const bench=(x,z,ry)=>{put("box",x,GY+.15,z,.7,.06,.22,"#c7a27b",ry);put("box",x,GY,z,.06,.15,.2,"#9b7a58",ry)};
  const lot=(x,z)=>put("box",x,GY,z,.9,.02,.9,"#e3d2b2",0,0,0,true);
  const sign=(x,z)=>{put("box",x,GY,z,.06,.7,.06,"#a88b6a");put("box",x,GY+.55,z,.55,.32,.05,"#ffffff");put("box",x,GY+.7,z+.03,.4,.05,.01,"#e0574a",0,0,0,true)};
  const field=(x,z,y)=>{put("box",x,GY,z,1,.03,1,"#dcc59b",0,0,0,true);for(let i=0;i<3;i++)put("box",x,GY+.03,z-.32+i*.32,.9,.13,.15,y%2?"#bfe08c":"#efd77f",0,0,0,true)};
  const plaza=(x,z,d)=>put("disc",x,GY,z,d,.02,d,"#f1eee4",0,0,0,true);

  // 散布
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    if(!isLand(x,y))continue;const cx0=x+.5+(r()-.5)*.3,cz0=y+.5+(r()-.5)*.3;
    if(isBeach(x,y)){if(r()<.06)palm(cx0,cz0);continue}
    if(r()<.45)grass(x+r(),y+r());
    if(r()<.07)flowers(x+.5,y+.5);
    if(occ[y*W+x]||roadOcc[y*W+x])continue;
    const k=AKEYS[zone[y*W+x]],v=r();
    if(k==="t7"){if(v<.42)tree(cx0,cz0,.9+r()*.4);else if(v<.55)bush(cx0,cz0)}
    else if(k==="t1"){if(v<.15)house(cx0,cz0,ROOFS[r()*4|0],(r()<.5?0:Math.PI/2));else if(v<.24)tree(cx0,cz0);else if(v<.3)bush(cx0,cz0)}
    else if(k==="t2"){if((x+y)%7<4&&v<.8)field(x+.5,y+.5,y);else if(v<.9)tree(cx0,cz0,.8)}
    else if(k==="t3"){if(v<.13)palm(cx0,cz0);else if(v<.18)stall(cx0,cz0,r()<.5?"#9fd0e6":"#f4b49a");else if(v<.24)bush(cx0,cz0)}
    else if(k==="t4"){if(v<.17)shop(cx0,cz0,["#e0574a","#57a7c2","#f0c25a"][r()*3|0]);else if(v<.22)tree(cx0,cz0,.8)}
    else if(k==="t5"){if(v<.08)plaza(x+.5,y+.5,1.6);else if(v<.17)tree(cx0,cz0);else if(v<.21)bench(cx0,cz0,r()*3)}
    else if(k==="t6"){if(v<.06)house(cx0,cz0,"#e9a07f",0);else if(v<.2)tree(cx0,cz0);else if(v<.26)bush(cx0,cz0)}
    else if(k==="t8"){if(v<.08)lot(x+.5,y+.5);else if(v<.13)sign(cx0,cz0);else if(v<.17)put("box",cx0,GY,cz0,.8,1.1+r()*.8,.8,"#e9eef2");else if(v<.22)bush(cx0,cz0)}
  }
  // 地標
  const C=k=>[ZC[k][0]+.5,ZC[k][1]+.5];
  {const[x,z]=C("t1");plaza(x,z,4.4);put("box",x,GY,z,3,1.1,1.3,"#fbf8f1");put("box",x,GY+1.1,z,3.2,.12,1.5,"#a9cdea");for(let i=0;i<5;i++)put("box",x-1.2+i*.6,GY+.5,z+.66,.32,.28,.02,"#a9d3e8",0,0,0,true);put("cyl",x+1.9,GY,z+.6,.05,2,.05,"#dddddd");put("box",x+2.2,GY+1.65,z+.6,.55,.34,.03,"#e0574a")}

    const canMod=S.isOwner||S.canEdit||S.mode==="local";
    pBody.innerHTML=`
      ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:""}
      <div class="state">${state}</div>
      <section><h3 style="margin:0 0 8px;font-size:16px">大家的解方</h3>
        ${n?`<ul class="sol-list">${sols.map(s=>`<li class="sol"><div class="t">${esc(s.text)}${s.value?`<div class="muted" style="font-size:13px;margin-top:4px">💼 ${esc(s.value)}</div>`:""}</div>
          <button class="vote" data-vote="${esc(s.id)}" aria-pressed="${iVoted(s.id)}" aria-label="支持這個解方，目前 ${s.v} 票">👍 ${s.v}</button>
          <div class="meta">${(s.uses||[]).map(k=>RES[k]?`<span class="mini" style="--c:${RES[k].css}">${RES[k].ch}</span>`:"").join("")}<span>· ${esc(s.by==="me"?"你":(s.name||"同學"))}</span>
          ${(canMod||s.by===myId())?`<button class="del" data-delsol="${esc(s.id)}">刪除</button>`:""}</div></li>`).join("")}</ul>`
          :`<div class="empty">這裡還很空。你的想法會在旗子旁邊長出第一棵樹。</div>`}
      </section>
      <form class="form" id="solForm">
        <h3>提出你的解方</h3>
        <label class="lb" for="solText">你會怎麼解決這個問題？
          <textarea id="solText" maxlength="500" placeholder="例如：和返鄉青年合作，把老製茶廠改成體驗工坊，讓遊客跟著茶農做一次茶">${esc(draft.text||"")}</textarea></label>
        <div class="lb">這個解方用到了哪些地方資源？（人文地產景，可複選）
          <div class="uses">${RKEYS.map(k=>`<button type="button" class="chipbtn" style="--c:${RES[k].css}" data-use="${k}" aria-pressed="${draft.uses.includes(k)}">${RES[k].ch} ${RES[k].full}</button>`).join("")}</div></div>
        <div class="err" id="solErr"></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn primary" type="submit" ${S.readOnly?"disabled":""}>種下解方 🌱</button>
          ${S.mode==="local"?`<button class="btn" type="button" id="copyMine">複製我的解方</button>`:""}</div>
      </form>
      ${S.isOwner||p.by==="me"?`<button class="del" data-delprob="${esc(p.id)}" style="align-self:flex-start">刪除這個問題</button>`:""}`;
    bindProblem(p);
  }
  if(v.type==="list"){
    const f=v.filter||"all";
    const list=S.problems.filter(p=>f==="all"||(f==="open"?solsFor(p.id).length===0:p.area===f));
    pHead.innerHTML=`<h2 style="margin:0">問題清單</h2><span class="place" style="margin:0">點一題，人物會走過去</span>`;
    pBody.innerHTML=`<div class="filters">${[["all","全部"],["open","🚩 待解"]].concat(AKEYS.map(k=>[k,AREAS[k].ch])).map(([k,l])=>`<button class="chipbtn" style="--c:${AREAS[k]?AREAS[k].css:"var(--ink)"}" data-filter="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</div>
      ${list.length?`<ul class="plist">${list.map(p=>{const a=AREAS[p.area]||AREAS.t1,n=solsFor(p.id).length;return `<li><button data-go="${esc(p.id)}"><span class="mini" style="--c:${a.css}">${p.no?esc(p.no):a.ch}</span><span>${esc(p.title)}</span><span class="n">${n?"🌱"+n:"🚩"}</span></button></li>`}).join("")}</ul>`:`<div class="empty">這個分類目前沒有問題。</div>`}`;
    pBody.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{panelView.filter=b.dataset.filter;renderPanel()});
    pBody.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const it=placed.find(x=>x.p.id===b.dataset.go);if(!it)return;overview=false;closePanel();av.tx=it.x;av.ty=it.y+8;av.goal=it.p.id;if(Math.hypot(it.x-av.x,it.y-av.y)>500){av.x=it.x;av.y=it.y+10}});
  }
  if(v.type==="add"){
    pHead.innerHTML=`<h2 style="margin:0">插一面問題旗</h2><span class="place" style="margin:0">把你盤點到的地方問題放上島</span>`;
    pBody.innerHTML=`<form class="form" id="addForm">
      <div class="lb">這個問題屬於哪個主題？<div class="uses">${AKEYS.map((k,i)=>`<button type="button" class="chipbtn" style="--c:${AREAS[k].css}" data-area="${k}" aria-pressed="${i===0}">${AREAS[k].ch} ${AREAS[k].full}</button>`).join("")}</div></div>
      <label class="lb" for="apPlace">地點（鄉鎮或村里，選填）<input type="text" id="apPlace" maxlength="40" placeholder="例如：臺南市後壁區"></label>
      <label class="lb" for="apTitle">問題（一句話）<input type="text" id="apTitle" maxlength="80" placeholder="例如：稻米收購價低，年輕人不願接手農地"></label>
      <label class="lb" for="apDesc">補充說明（選填）<textarea id="apDesc" maxlength="400" placeholder="你觀察到什麼？訪談到誰？"></textarea></label>
      <div class="err" id="apErr"></div><button class="btn primary" type="submit" ${S.readOnly?"disabled":""}>插上旗子 🚩</button></form>`;
    let area="t1";pBody.querySelectorAll("[data-area]").forEach(b=>b.onclick=()=>{area=b.dataset.area;pBody.querySelectorAll("[data-area]").forEach(x=>x.setAttribute("aria-pressed",x===b))});
    $("addForm").onsubmit=async e=>{e.preventDefault();const title=$("apTitle").value.trim();if(title.length<4){$("apErr").textContent="問題至少寫 4 個字。";return}
      try{await addProblem({area,place:$("apPlace").value.trim(),title,desc:$("apDesc").value.trim()});toast("旗子插好了，去島上找找看");closePanel();overview=true}catch(err){$("apErr").textContent=failWrite(err)}};
  }
  if(v.type==="admin"&&!S.isOwner){
    pHead.innerHTML=`<h2 style="margin:0">老師登入</h2><span class="place" style="margin:0">登入後可以匯入問題、刪除任何內容</span>`;
    pBody.innerHTML=S.adminEnabled===false?`<div class="empty">還沒有設定老師密碼。請到 Netlify 網站設定的 Environment variables 新增 ADMIN_PASSWORD，再重新部署一次。</div>`
      :`<form class="form" id="loginForm"><label class="lb" for="pw">老師密碼<input type="password" id="pw" autocomplete="current-password"></label><div class="err" id="pwErr"></div><button class="btn primary" type="submit">登入</button></form>`;
    const lf=$("loginForm");
    if(lf)lf.onsubmit=async e=>{e.preventDefault();const pw=$("pw").value;
      try{const d=await api("admin",{password:pw});if(d.ok){S.adminPw=pw;S.isOwner=true;$("bAdmin").textContent="老師後台";setNotice();renderPanel()}else $("pwErr").textContent="密碼不對，請再試一次。"}
      catch(err){$("pwErr").textContent="登入失敗，請檢查網路後再試一次。"}};
  }
  else if(v.type==="admin"){
    pHead.innerHTML=`<h2 style="margin:0">老師後台</h2><span class="place" style="margin:0">把學生盤點的問題一次放上島</span>`;
    pBody.innerHTML=`<div class="form"><h3>課堂的 40 個問題</h3><p class="muted" style="margin:0;font-size:13px">一鍵把 8 個主題、40 個問題插上島，學生就能直接開始提解方。</p>
      <button class="btn primary" id="presetBtn" type="button">放上課堂的 40 個問題</button><div class="err" id="presetErr"></div></div>
      <form class="form" id="impForm"><h3>另外匯入其他問題</h3>
      <p class="muted" style="margin:0;font-size:13px">一行一個問題，格式：<b>主題編號｜問題｜補充說明</b>。主題編號填 1 到 8；補充說明可以留空。</p>
      <textarea id="impText" style="min-height:180px" placeholder="2｜稻米收購價低，年輕人不願接手農地｜訪談三戶農家都說沒有接班人&#10;4｜車站前老街店面一半拉下鐵門"></textarea>
      <div class="err" id="impErr"></div><button class="btn primary" type="submit">匯入到島上</button></form>
      <div class="muted" style="font-size:13px">目前島上有 ${S.problems.length} 個問題、${S.solutions.length} 個解方。把這個網址分享給學生，他們不用登入就能插旗、提出解方和按讚。</div>
      <button class="btn" id="exportAll" type="button">複製全部問題與解方</button><div class="copybox" id="exportBox" hidden></div>
      <div class="form"><h3>清空整座島</h3><p class="muted" style="margin:0;font-size:13px">刪除所有問題、解方和按讚，適合新學期重新開始。刪除後無法復原，建議先按上面的按鈕複製留存。</p>
      <button class="btn" id="resetBtn" type="button">清空整座島</button><div class="err" id="resetErr"></div></div>`;
    const armBtn=(b,label,fn)=>{b.onclick=async()=>{if(!b.dataset.armed){b.dataset.armed=1;b.textContent=label;setTimeout(()=>{if(b.isConnected&&b.dataset.armed){delete b.dataset.armed;b.textContent=b.dataset.orig}},4000);return}delete b.dataset.armed;b.disabled=true;try{await fn()}finally{if(b.isConnected){b.disabled=false;b.textContent=b.dataset.orig}}}};
    const pb=$("presetBtn");pb.dataset.orig=pb.textContent;
    const runPreset=async()=>{try{await api("import",{password:S.adminPw,items:PRESET.map(([area,no,title])=>({area,no,title}))});await load();toast("已插上 40 面旗子");closePanel();overview=true}catch(err){$("presetErr").textContent=failWrite(err)}};
    if(S.problems.some(p=>p.no)){armBtn(pb,"島上已有課堂問題，再按一次會重複放上",runPreset)}else{pb.onclick=async()=>{pb.disabled=true;await runPreset();if(pb.isConnected)pb.disabled=false}}
    const rb=$("resetBtn");rb.dataset.orig=rb.textContent;
    armBtn(rb,"再按一次確認清空",async()=>{try{await api("reset",{password:S.adminPw});await load();toast("島已清空")}catch(err){$("resetErr").textContent=failWrite(err)}});
    $("impForm").onsubmit=async e=>{e.preventDefault();const lines=$("impText").value.split(/\n/).map(l=>l.trim()).filter(Boolean);const out=[],bad=[];
      lines.forEach((l,i)=>{const parts=l.split(/[｜|]/).map(s=>s.trim());const k=themeKey(parts[0]);if(!k||!parts[1]||parts[1].length<4){bad.push(i+1);return}out.push({area:k,title:parts[1],desc:parts.slice(2).join("｜")})});
      if(bad.length){$("impErr").textContent=`第 ${bad.join("、")} 行格式不對，主題編號要是 1 到 8，而且問題至少 4 個字。`;return}
      if(!out.length){$("impErr").textContent="請先貼上問題。";return}
      try{await api("import",{password:S.adminPw,items:out});await load();toast(`已插上 ${out.length} 面旗子`);closePanel();overview=true}catch(err){$("impErr").textContent=failWrite(err)}};
    $("exportAll").onclick=()=>{const txt=exportText();copy(txt,$("exportBox"))};
  }
  if(v.type==="nick"){
    $("pClose").hidden=!S.nick;
    pHead.innerHTML=`<h2 style="margin:0">${S.nick?"修改暱稱":"歡迎來到解方島"}</h2><span class="place" style="margin:0">${S.nick?"新的暱稱會用在之後提出的解方":"出發前，先告訴大家你是誰"}</span>`;
    pBody.innerHTML=`<form class="form" id="nickForm"><label class="lb" for="nickIn">你的暱稱（會顯示在你提出的解方旁邊）<input type="text" id="nickIn" maxlength="20" placeholder="例如：小安" autocomplete="nickname" value="${esc(S.nick)}"></label>
      <div class="err" id="nickErr"></div><button class="btn primary" type="submit">${S.nick?"儲存":"出發！"}</button></form>`;
    $("nickForm").onsubmit=e=>{e.preventDefault();const n=$("nickIn").value.trim().slice(0,20);if(!n){$("nickErr").textContent="請輸入暱稱。";return}
      const first=!S.nick;S.nick=n;LS.set("isle_nick",n);updateMe();lastSync=0;sync();if(first&&!LS.get("isle_seen",0))openPanel({type:"how"});else{closePanel();if(!first)toast("暱稱已更新")}};
    setTimeout(()=>{const i=$("nickIn");if(i&&!S.nick)i.focus()},60);
  }
  if(v.type==="how"){
    pHead.innerHTML=`<h2 style="margin:0">怎麼玩</h2>`;
    pBody.innerHTML=`<div class="howto"><ol>
      <li>點地面讓人物走過去，拖曳可以旋轉視角，滾輪或兩指可以縮放。電腦也可以用方向鍵或 WASD 走路。</li>
      <li>島分成 8 個主題區，從「人口與青年」到「地方發展與資訊」。每面旗子是課堂上盤點出來的一個地方問題，旗子上的標籤顯示問題編號和解方數量。</li>
      <li><b>紅旗</b>代表還沒有人提出解方。走過去點旗子，寫下你的解方，並標記它用到哪些地方資源：<b>人、文、地、產、景</b>。</li>
      <li>每多一個解方，旗子旁就長出一棵樹；累積 3 個解方，紅旗就會蓋成<b>亮燈小屋</b>。</li>
      <li>島上其他人物是正在線上的同學，頭上會顯示他們的暱稱。</li>
      <li>看到好點子就按 👍 支持。目標：讓整座島亮起來。</li></ol>
      <p class="muted" style="font-size:13px;margin-top:12px">好的解方通常會結合兩三種地方資源，而不只是辦一場活動。</p></div>
      <button class="btn primary" id="howGo" type="button">開始探索</button>`;
    $("howGo").onclick=()=>{LS.set("isle_seen",1);closePanel()};
  }
}
function bindProblem(p){
  pBody.querySelectorAll("[data-vote]").forEach(b=>b.onclick=()=>{if(S.readOnly){toast("目前只能瀏覽");return}toggleVote(b.dataset.vote)});
  pBody.querySelectorAll("[data-use]").forEach(b=>b.onclick=()=>{const k=b.dataset.use;draft.uses=draft.uses.includes(k)?draft.uses.filter(x=>x!==k):draft.uses.concat(k);b.setAttribute("aria-pressed",draft.uses.includes(k))});
  const armDel=(b,fn)=>{b.onclick=async()=>{if(b.dataset.armed){try{await fn()}catch(e){toast(failWrite(e))}}else{b.dataset.armed=1;b.textContent="再按一次確認刪除";setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent="刪除"}},3000)}}};
  pBody.querySelectorAll("[data-delsol]").forEach(b=>armDel(b,()=>delSolution(b.dataset.delsol)));
  pBody.querySelectorAll("[data-delprob]").forEach(b=>armDel(b,async()=>{await delProblem(b.dataset.delprob);closePanel()}));
  const ta=$("solText");ta.oninput=()=>draft.text=ta.value;
  $("solForm").onsubmit=async e=>{e.preventDefault();const text=ta.value.trim();
    if(text.length<10){$("solErr").textContent="解方至少寫 10 個字，說明你要怎麼做。";return}
    if(!draft.uses.length){$("solErr").textContent="請至少選一個用到的地方資源。";return}
    const btn=e.submitter||$("solForm").querySelector("[type=submit]");btn.disabled=true;
    try{await addSolution({problemId:p.id,text,uses:draft.uses.slice()});draft.text="";draft.uses=[];toast("🌱 解方種下了！");renderPanel()}
    catch(err){$("solErr").textContent=failWrite(err);btn.disabled=false}};
  const cm=$("copyMine");if(cm)cm.onclick=()=>{const mine=S.solutions.filter(s=>s.by===myId());if(!mine.length){toast("你還沒有提出解方");return}
    copy(mine.map(s=>{const pp=S.problems.find(x=>x.id===s.problemId);return `【問題】${pp?pp.title:""}\n【解方】${s.text}\n【用到資源】${(s.uses||[]).map(k=>RES[k]?RES[k].ch:"").join("、")}${s.value?`\n【創造價值】${s.value}`:""}`}).join("\n\n"),null)};
}
function exportText(){return S.problems.map(p=>{const a=AREAS[p.area]||AREAS.t1;const ss=solsFor(p.id).map(s=>({...s,v:voteCount(s.id)})).sort((x,y)=>y.v-x.v);
  return `${a.name}${p.no?" #"+p.no:""}｜${p.title}\n`+(ss.length?ss.map(s=>`  - ${s.text}（${(s.uses||[]).map(k=>RES[k]?RES[k].ch:"").join("")}，👍${s.v}）`).join("\n"):"  （尚無解方）")}).join("\n\n")}
function copy(txt,box){const done=()=>toast("已複製");
  const fallback=()=>{const b=box||(()=>{const d=document.createElement("div");d.className="copybox";pBody.appendChild(d);return d})();b.hidden=false;b.textContent=txt;const r=document.createRange();r.selectNodeContents(b);const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取文字，請按 Ctrl+C 或長按複製")};
  try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(e){fallback()}}

$("bList").onclick=()=>openPanel({type:"list",filter:"all"});
$("bHow").onclick=()=>openPanel({type:"how"});
$("bMe").onclick=()=>openPanel({type:"nick"});
function updateMe(){$("meName").textContent=S.nick||"設定暱稱";meEl.textContent=S.nick||"我"}
$("bAdd").onclick=()=>openPanel({type:"add"});
$("bAdmin").onclick=()=>openPanel({type:"admin"});

/* ---------- 資料更新 ---------- */
let lastSig="";
function onData(){
  const sig=JSON.stringify([S.problems,S.solutions,S.counts,[...S.mine],S.offline,S.isOwner]);
  if(sig===lastSig){return}lastSig=sig;
  placeProblems();
  const open=S.problems.filter(p=>solsFor(p.id).length===0).length;
  $("sOpen").textContent=open;$("sProb").textContent=S.problems.length;$("sSol").textContent=S.solutions.length;
  $("sMine").textContent=S.solutions.filter(s=>s.by===myId()).length;
  setNotice();
  if(panelView&&(panelView.type==="problem"||panelView.type==="list")){
    const ae=document.activeElement;if(!(ae&&(ae.id==="solText"||ae.id==="nickIn")))renderPanel();
  }
}
requestAnimationFrame(frame);
updateMe();
if(!S.nick)openPanel({type:"nick"});else if(!LS.get("isle_seen",0))openPanel({type:"how"});
initData();
})();
</script>

</body>
</html>
